name: Refresh leaderboard

on:
  schedule:
    # Vulture posts the new leaderboard Tuesdays around noon ET; check that
    # afternoon and again Wednesday in case it slips. (UTC.)
    - cron: '30 17 * * 2'
    - cron: '30 21 * * 2'
    - cron: '30 15 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch leaderboard and recompute
        run: python scripts/update.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/snapshot.json data/history.json; then
            echo "no leaderboard change"
            exit 0
          fi
          label=$(python -c "import json;print(json.load(open('data/snapshot.json'))['leaderboardUpdated'] or 'latest')")
          git add data/snapshot.json data/history.json
          git commit -m "Leaderboard: $label"
          git push
